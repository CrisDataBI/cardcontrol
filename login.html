<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardControl — Acceder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">💳</div>
      <h1>CardControl</h1>
      <p>Gestiona tus tarjetas de crédito con inteligencia</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Crear cuenta</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- LOGIN -->
    <form id="form-login" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="l-email" placeholder="correo@ejemplo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="l-password" placeholder="Tu contraseña" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-login">Iniciar sesión</button>
      <p style="text-align:center;font-size:13px;color:rgba(255,255,255,0.35);margin-top:12px">
        <a href="#" onclick="showForgot(event)" style="color:#4d9ff8">¿Olvidaste tu contraseña?</a>
      </p>
    </form>

    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 4px">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
      <span style="font-size:12px;color:rgba(255,255,255,0.28)">o continúa con</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
    </div>
    <button onclick="doGoogle()" class="btn-google" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continuar con Google
    </button>

    <!-- REGISTER -->
    <form id="form-register" onsubmit="doRegister(event)" style="display:none">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="r-name" placeholder="Tu nombre" required>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="r-email" placeholder="correo@ejemplo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="r-password" placeholder="Crea una contraseña" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-register">Crear cuenta gratis</button>
      <p style="text-align:center;font-size:12px;color:rgba(255,255,255,0.28);margin-top:12px">
        Al registrarte aceptas que tus datos se almacenan de forma segura.
      </p>
    </form>

    <!-- FORGOT -->
    <form id="form-forgot" onsubmit="doForgot(event)" style="display:none">
      <p style="font-size:13px;color:#6b7280;margin-bottom:14px">Te enviaremos un enlace para restablecer tu contraseña.</p>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="f-email" placeholder="correo@ejemplo.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Enviar enlace</button>
      <p style="text-align:center;font-size:13px;color:#6b7280;margin-top:12px">
        <a href="#" onclick="switchTab('login')" style="color:#4d9ff8">Volver al inicio de sesión</a>
      </p>
    </form>

    <p style="text-align:center;font-size:13px;color:rgba(255,255,255,0.25);margin-top:1.5rem">
      <a href="index.html" style="color:rgba(255,255,255,0.35);text-decoration:none;transition:color 0.2s" onmouseover="this.style.color='rgba(255,255,255,0.7)'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">← Volver al inicio</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  db.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'app.html';
  });

  const params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'register') switchTab('register');

  function switchTab(tab) {
    document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('form-forgot').style.display = 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    clearError();
  }

  function showForgot(e) {
    e.preventDefault();
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-register').style.display = 'none';
    document.getElementById('form-forgot').style.display = '';
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  }

  function showError(msg) { const el = document.getElementById('auth-error'); el.textContent = msg; el.style.display = 'block'; }
  function clearError() { document.getElementById('auth-error').style.display = 'none'; }

  async function doLogin(e) {
    e.preventDefault(); clearError();
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('l-email').value,
      password: document.getElementById('l-password').value,
    });
    if (error) { showError('Correo o contraseña incorrectos.'); btn.disabled = false; btn.textContent = 'Iniciar sesión'; }
    else window.location.href = 'app.html';
  }

  async function doRegister(e) {
    e.preventDefault(); clearError();
    const btn = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = 'Creando cuenta...';
    const { error } = await db.auth.signUp({
      email: document.getElementById('r-email').value,
      password: document.getElementById('r-password').value,
      options: { data: { full_name: document.getElementById('r-name').value } }
    });
    if (error) { showError(error.message); btn.disabled = false; btn.textContent = 'Crear cuenta gratis'; }
    else {
      document.getElementById('form-register').innerHTML = `
        <div class="alert alert-success">✅ Cuenta creada. Revisa tu correo para confirmar, luego inicia sesión.</div>
        <button class="btn btn-full" onclick="switchTab('login')" style="margin-top:10px">Ir al inicio de sesión</button>`;
    }
  }

  async function doGoogle() {
    const btn = document.getElementById('btn-google');
    btn.disabled = true; btn.textContent = 'Redirigiendo...';
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/app.html' }
    });
    if (error) { showError(error.message); btn.disabled = false; btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Continuar con Google`; }
  }

  async function doForgot(e) {
    e.preventDefault();
    const { error } = await db.auth.resetPasswordForEmail(
      document.getElementById('f-email').value,
      { redirectTo: window.location.origin + '/app.html' }
    );
    if (error) showError(error.message);
    else document.getElementById('form-forgot').innerHTML = `
      <div class="alert alert-success">✅ Revisa tu correo. Te enviamos el enlace de recuperación.</div>
      <button class="btn btn-full" onclick="switchTab('login')" style="margin-top:10px">Volver al inicio</button>`;
  }
</script>
</body>
</html>
